<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#203eec"><meta name="description" content="Meet bimba, your cozy pixel companion. Hold hands, share toast, and spend a little time together."><title>bimba — Can you play with me?</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><a class="brand" href="./">bimba</a><span class="edition">Can you play with me?</span></header>
<section class="room" id="room" aria-label="Companion play area"><div class="pet" id="pet"><div class="bubble" id="bubble" role="status" aria-live="polite">Hi, I’m here.</div><button class="character" id="character" aria-label="Pet bimba or drag her to move"><canvas id="canvas" width="280" height="350"></canvas><span id="loading">Waking up bimba…</span></button><div class="hover-zone head-zone" aria-hidden="true"></div><div class="hover-zone face-zone" aria-hidden="true"></div><button class="hand-zone hand-left" id="hand-left" aria-label="Hold hands and walk left"></button><button class="hand-zone hand-right" id="hand-right" aria-label="Hold hands and walk right"></button><div id="particles" aria-hidden="true"></div></div><div class="companion-toolbar"><span id="state" hidden aria-hidden="true"></span><div class="controls"><button id="hold" class="pixel-action" aria-label="Hold hands to follow your cursor; click again to let go"><img src="assets/button-hand.png" alt="" draggable="false"><span id="hold-label">Hold</span></button><div id="hold-menu" class="hold-menu" hidden><button id="choose-left">← Walk left</button><button id="choose-right">Walk right →</button></div><button id="pat" class="pixel-action" aria-label="Pet"><img src="assets/button-heart.svg" alt="" draggable="false"><span>Pet</span></button><button id="feed" class="pixel-action" aria-label="Feed"><img src="assets/button-toast.png" alt="" draggable="false"><span id="feed-label">Feed</span></button><button id="talk" class="pixel-action" aria-label="Chat"><img src="assets/button-bubble.png" alt="" draggable="false"><span>Chat</span></button></div></div></section>
<footer><p class="hint">Click to pet · Drag to lift · Hold hands and move your cursor · Click again to let go</p></footer></main>
<video id="idle" src="assets/jump.mp4" muted playsinline loop preload="auto" hidden></video><video id="walk" src="assets/walk.mp4" muted playsinline loop preload="auto" hidden></video><video id="awake" src="assets/awake.mp4" muted playsinline loop preload="auto" hidden></video><video id="hold-left-video" src="assets/hold-left.mp4" muted playsinline preload="auto" hidden></video><video id="hold-right-video" src="assets/hold-right.mp4" muted playsinline preload="auto" hidden></video><video id="sit" src="assets/sit.mp4" muted playsinline preload="auto" hidden></video><video id="eat" src="assets/eat.mp4" muted playsinline preload="auto" hidden></video><script src="app.js"></script></body></html>
